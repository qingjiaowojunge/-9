name: 编译并发布 APK

# 触发条件：推送到 main 分支时自动编译并发布 Release，也可手动触发
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 配置 JDK 17
      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 配置 Android SDK 基础环境
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      # 4. 用 sdkmanager 显式安装编译所需的 SDK 组件
      - name: 安装 SDK 组件
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # 5. 准备游戏资源
      - name: 准备游戏资源
        run: |
          mkdir -p app/src/main/assets
          cp web/index.html app/src/main/assets/index.html
          cp web/game.js app/src/main/assets/game.js
          curl -L --fail -o app/src/main/assets/three.min.js \
            "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"
          ls -la app/src/main/assets/

      # 6. 安装 Gradle 8.2
      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      # 7. 编译 Debug APK
      - name: 编译 Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      # 8. 重命名 APK
      - name: 重命名 APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk "output/MinecraftWeb.apk"
          ls -la output/

      # 9. 创建 Tag 并发布 Release（自动上传 APK）
      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 我的世界 Web版 v1.0.${{ github.run_number }}
          body: |
            自动构建 #${{ github.run_number }}

            ## 下载安装
            1. 下载 APK 文件到手机
            2. 文件管理器找到下载的 APK
            3. 开启「设置 → 安全 → 允许未知来源」
            4. 点击 APK 安装
          files: output/MinecraftWeb.apk
          prerelease: false

      # 10. 构建完成
      - name: 构建完成
        run: |
          echo "APK 构建完成!"
          echo "Release 已发布，可在 Releases 页面直接下载"
